name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'app/installer.conf.json'
      - 'app/tauri.conf.json'
      - 'app/src/**'
      - 'app/Cargo.toml'
      - 'app/Cargo.lock'
      - 'app/build.rs'
      - 'app/capabilities/**'
      - 'app/icons/**'
      - 'ui/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/manual/license_inventory.py'
      - 'packaging/windows/**'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Parse native Windows smoke scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem packaging/windows/*.ps1) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.25.0'
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      - name: Desktop dependency notices
        working-directory: app
        run: python ../tests/manual/license_inventory.py ../desktop-notices/rust
      - run: python packaging/windows/frontend_notices.py desktop-notices/frontend
      - name: Record installer source
        run: Set-Content desktop-notices/BUILD_COMMIT.txt $env:GITHUB_SHA
      - name: Build current-user Windows installer
        working-directory: app
        # Invoke Node directly so PowerShell does not consume the argument
        # separator in pnpm's .ps1 shim before Cargo receives --locked.
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build --config installer.conf.json --bundles nsis -- --locked
      - name: Download verified upgrade baseline
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'VeekPanel-0.1.0-setup.exe'
          Invoke-WebRequest 'https://github.com/apittman019-svg/VeekPanel/releases/download/v0.1.0-preview.1/VeekPanel_0.1.0_x64-setup.exe' -OutFile $path
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne 'd4bb646af11e3646caaf696be9e91c9b3af9ca440546e1aa83ef84ab042f6c16') { throw 'Upgrade baseline checksum mismatch' }
      - name: Install, launch, upgrade, reinstall and uninstall on Windows
        shell: pwsh
        timeout-minutes: 10
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'veek-windows-smoke'
          $null = New-Item -ItemType Directory -Path $evidence -Force
          $result = @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;os=[Environment]::OSVersion.VersionString;status='running'}
          Start-Transcript -Path (Join-Path $evidence 'transcript.txt')
          try {
            ./packaging/windows/smoke.ps1 -PreviousInstaller (Join-Path $env:RUNNER_TEMP 'VeekPanel-0.1.0-setup.exe')
            $result.status = 'passed'
          } catch {
            $result.status = 'failed'
            $result.error = $_.Exception.Message
            throw
          } finally {
            $result | ConvertTo-Json | Set-Content (Join-Path $evidence 'result.json')
            Stop-Transcript
          }
      - name: Retain Windows validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VeekPanel-Windows-validation
          path: ${{ runner.temp }}/veek-windows-smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Hash verified installer
        shell: pwsh
        run: |
          $file = Get-ChildItem app/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii app/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VeekPanel-Windows-installer
          path: |
            app/target/release/bundle/nsis/*-setup.exe
            app/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

name: VeekPanel core and desktop CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux hardware and native audio build/test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libpipewire-0.3-dev libclang-dev pipewire-bin
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Serial PTY integration (synthetic)
        if: runner.os == 'Linux'
        run: python3 tests/serial_pty.py target/release/veek-probe
      - name: Capture PTY integration (synthetic)
        if: runner.os == 'Linux'
        run: python3 tests/capture_pty.py target/release/veek-probe
      - name: Native PipeWire integration (isolated server, synthetic audio/hardware)
        if: runner.os == 'Linux'
        run: python3 tests/audio/pipewire_integration.py target/release/veek-audio-probe
      - name: Persistent mapping runtime (private native server)
        if: runner.os == 'Linux'
        run: python3 tests/audio/runtime_integration.py target/release/veek-runtime
      - name: Windows audio read-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service AudioEndpointBuilder -StartupType Manual
          Set-Service Audiosrv -StartupType Manual
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          ./target/release/veek-audio-probe.exe --help
          ./target/release/veek-audio-probe.exe list
          if ($LASTEXITCODE -ne 0) { throw 'Core Audio enumeration failed' }
      - name: Stage Windows diagnostic kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostic-kit
          Copy-Item target/release/veek-probe.exe diagnostic-kit/
          Copy-Item tests/manual/START-HERE.cmd,tests/manual/TEST-MINI.cmd,tests/manual/README.txt,tests/manual/RESULTS.txt,tests/manual/MINI-RESULTS.txt,LICENSE diagnostic-kit/
          Set-Content diagnostic-kit/BUILD_COMMIT.txt $env:GITHUB_SHA
          ./diagnostic-kit/veek-probe.exe --help
          ./diagnostic-kit/veek-probe.exe capture --help
          ./diagnostic-kit/veek-probe.exe test-mini --help
      - name: Stage Linux diagnostic kit
        if: runner.os == 'Linux'
        run: |
          mkdir diagnostic-kit
          cp target/release/veek-probe tests/manual/README.txt tests/manual/RESULTS.txt tests/manual/MINI-RESULTS.txt LICENSE diagnostic-kit/
          echo "$GITHUB_SHA" > diagnostic-kit/BUILD_COMMIT.txt
      - name: Bundle dependency license notices
        run: python tests/manual/license_inventory.py diagnostic-kit/THIRD_PARTY
      - name: Archive Windows diagnostic kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path diagnostic-kit/* -DestinationPath veekpanel-m1-Windows-x64.zip
      - name: Archive Linux diagnostic kit
        if: runner.os == 'Linux'
        run: tar -czf veekpanel-m1-Linux-x64.tar.gz -C diagnostic-kit .
      - name: Upload diagnostic archives (not installers)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veekpanel-m1-${{ runner.os }}-x64
          path: |
            veekpanel-m1-*.zip
            veekpanel-m1-*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Stage Windows M2 audio kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path audio-kit
          Copy-Item target/release/veek-audio-probe.exe audio-kit/
          Copy-Item tests/audio/README.txt,tests/audio/LIST-AUDIO.cmd,LICENSE,diagnostic-kit/BUILD_COMMIT.txt audio-kit/
          Copy-Item -Recurse diagnostic-kit/THIRD_PARTY audio-kit/
          Compress-Archive -Path audio-kit/* -DestinationPath veekpanel-m2-Windows-x64.zip
      - name: Stage Linux M2 audio kit
        if: runner.os == 'Linux'
        run: |
          mkdir audio-kit
          cp target/release/veek-audio-probe tests/audio/README.txt LICENSE diagnostic-kit/BUILD_COMMIT.txt audio-kit/
          cp -r diagnostic-kit/THIRD_PARTY audio-kit/
          tar -czf veekpanel-m2-Linux-x64.tar.gz -C audio-kit .
      - name: Upload experimental M2 audio archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veekpanel-m2-${{ runner.os }}-x64
          path: |
            veekpanel-m2-*.zip
            veekpanel-m2-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
      - name: Linux native desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libpipewire-0.3-dev libclang-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pipewire-bin xvfb webkit2gtk-driver dbus nsis
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui check
      - run: pnpm --dir ui test
      - run: pnpm --dir ui build
      - run: cargo fmt --manifest-path app/Cargo.toml --check
      - run: cargo clippy --manifest-path app/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path app/Cargo.toml --locked
      - name: Tray host loss/recovery on a disposable session bus
        if: runner.os == 'Linux'
        run: dbus-run-session -- env VEEK_PRIVATE_DBUS_TEST=1 cargo test --manifest-path app/Cargo.toml --locked private_bus_tray_host_loss_and_recovery -- --ignored
      - name: Compile the actual Windows startup cleanup hook
        if: runner.os == 'Linux'
        run: makensis -WX -V2 -DVEEK_HOOK_OUTPUT=/tmp/veek-hook-syntax.exe tests/gui/installer_hook_compile.nsi
      - run: cargo build --manifest-path app/Cargo.toml --locked
      - name: Install native UI test driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Native GUI with private PipeWire and synthetic panel
        if: runner.os == 'Linux'
        run: dbus-run-session -- python3 tests/gui/native_smoke.py app/target/debug/veekpanel /tmp/veek-ui-evidence

name: Hardware prototype CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux HID and serial build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Serial PTY integration (synthetic)
        if: runner.os == 'Linux'
        run: python3 tests/serial_pty.py target/release/veek-probe
      - name: Capture PTY integration (synthetic)
        if: runner.os == 'Linux'
        run: python3 tests/capture_pty.py target/release/veek-probe
      - name: Stage Windows diagnostic kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diagnostic-kit
          Copy-Item target/release/veek-probe.exe diagnostic-kit/
          Copy-Item tests/manual/START-HERE.cmd,tests/manual/README.txt,tests/manual/RESULTS.txt,LICENSE diagnostic-kit/
          ./diagnostic-kit/veek-probe.exe --help
          ./diagnostic-kit/veek-probe.exe capture --help
      - name: Stage Linux diagnostic kit
        if: runner.os == 'Linux'
        run: |
          mkdir diagnostic-kit
          cp target/release/veek-probe tests/manual/README.txt tests/manual/RESULTS.txt LICENSE diagnostic-kit/
      - name: Bundle dependency license notices
        run: python tests/manual/license_inventory.py diagnostic-kit/THIRD_PARTY
      - name: Archive Windows diagnostic kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path diagnostic-kit/* -DestinationPath veekpanel-m1-Windows-x64.zip
      - name: Archive Linux diagnostic kit
        if: runner.os == 'Linux'
        run: tar -czf veekpanel-m1-Linux-x64.tar.gz -C diagnostic-kit .
      - name: Upload diagnostic archives (not installers)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veekpanel-m1-${{ runner.os }}-x64
          path: |
            veekpanel-m1-*.zip
            veekpanel-m1-*.tar.gz
          if-no-files-found: error
          retention-days: 30

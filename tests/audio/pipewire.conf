# Isolated test daemon only: no ALSA, Bluetooth, Pulse server or desktop session manager.
context.properties = { core.daemon = true core.name = veek-test }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = veek.output
        node.description = "VeekPanel isolated output" media.class = Audio/Sink
        audio.position = [ FL FR ] object.linger = true
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = veek.input
        node.description = "VeekPanel isolated input" media.class = Audio/Source
        audio.position = [ FL FR ] object.linger = true
    } }
]

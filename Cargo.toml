[workspace]
members = ["crates/veek-hardware", "crates/veek-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
hidapi = { version = "2.6.3", default-features = false }
serialport = "4.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

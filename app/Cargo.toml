[package]
name = "veekpanel"
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tempfile = "3"
veek-runtime = { path = "../crates/veek-runtime" }
veek-core = { path = "../crates/veek-core" }
veek-config = { path = "../crates/veek-config" }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[profile.release]
lto = "thin"
strip = true
